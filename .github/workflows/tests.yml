name: tests

on:
  push:
    branches: [ccr-f2c33173-3rzksa]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # 用户主要在 Windows 上跑，Linux 上再多测一个新版本 Python
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
