name: tests

on:
  push:
    # 现在的默认分支名是自动生成的，以后改名成 main 也照样触发
    branches: [ccr-f2c33173-3rzksa, main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # 用户主要在 Windows 上跑，Linux 上再多测一个新版本 Python
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # 网页冒烟测试（tests/test_web_smoke.py）：真起一个服务，用无头 Chromium 打开各页面。
  # 上面的 pytest 任务没装 playwright，这个测试会自动跳过；这里装上并要求必须跑（FORZA_WEB_TESTS=1）
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_web_smoke.py
        env:
          FORZA_WEB_TESTS: "1"
