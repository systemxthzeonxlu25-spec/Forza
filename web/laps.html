<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>圈速对比 · Forza 遥测</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/laps.css">
</head>
<body>
<!-- 圈速列表 + 分段 / 理论最佳 + 两圈对比。逻辑全在 laps.js，样式在 laps.css；
     数据来自 /api/laps、/api/sectors、/api/compare（调校版本名来自 /api/setups，没有时只用圈里记的名字） -->
<main class="page laps-page">

  <!-- 整页加载失败 / 还没有任何圈 -->
  <section class="card state-card" id="page-state" hidden></section>

  <!-- 筛选：赛道、车（都能直接改名） -->
  <section class="card filters" id="filters" hidden>
    <div class="filter-group" id="track-group">
      <span class="flabel">赛道</span>
      <span class="fctl" id="track-ctl"></span>
    </div>
    <div class="filter-group" id="car-group">
      <span class="flabel">车辆</span>
      <span class="fctl" id="car-ctl"></span>
    </div>
    <div class="filter-group" id="setup-group" hidden>
      <span class="flabel">调校</span>
      <span class="fctl" id="setup-ctl"></span>
    </div>
    <label class="chk"><input type="checkbox" id="complete-only"> 只看完整圈</label>
    <span class="grow"></span>
    <span class="muted small" id="lap-count"></span>
  </section>

  <!-- 圈列表 -->
  <section class="card" id="laps-card" hidden>
    <div class="card-head">
      <h2>圈列表</h2>
      <span class="muted small">选 <b class="tag-a">A</b> 参考圈、<b class="tag-b">B</b> 要分析的圈，下面自动对比（默认：最新一圈 vs 最快圈）</span>
    </div>
    <div class="table-wrap">
      <table class="lap-table" id="lap-table">
        <thead>
          <tr>
            <th class="c-pick" title="参考圈">A</th>
            <th class="c-pick" title="要分析的圈">B</th>
            <th class="c-num">圈</th>
            <th class="c-time">圈速</th>
            <th class="c-delta">与最快差</th>
            <th class="c-date">时间</th>
            <th class="c-flags">标记</th>
            <th class="c-note">备注</th>
            <th class="c-act">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 分段 / 理论最佳（每条赛道一张固定弯道表） -->
  <section class="card sec-card" id="sectors-card" hidden>
    <div class="card-head">
      <h2>分段 / 理论最佳</h2>
      <span class="muted small" id="sec-sub"></span>
      <span class="grow"></span>
      <span class="seg-sort sec-view" role="group" aria-label="显示方式">
        <button class="small-btn on" data-view="table">各段</button>
        <button class="small-btn" data-view="matrix">逐圈</button>
      </span>
      <button class="small-btn" id="sec-rebuild" title="用这条赛道最快的干净圈重新识别弯道（改过的弯名按位置沿用）">重算弯道表</button>
    </div>
    <div id="sec-body"></div>
  </section>

  <!-- 对比结果 -->
  <section id="compare" hidden>
    <div class="card cmp-head" id="cmp-head"></div>
    <div class="cmp-state" id="cmp-state" hidden></div>
    <div class="cmp-grid" id="cmp-body">
      <div class="card cmp-charts">
        <div class="chart-bar">
          <div class="legend" id="chart-legend"></div>
          <span class="grow"></span>
          <span class="muted small" id="zoom-label">全圈</span>
          <button class="small-btn" id="zoom-reset" hidden>看全圈</button>
          <span class="picker-wrap">
            <button class="small-btn" id="extra-btn" aria-expanded="false" title="选择要多看的曲线">更多曲线 ▾</button>
            <div class="extra-picker card" id="extra-picker" hidden></div>
          </span>
        </div>
        <div class="readout mono" id="readout"></div>
        <div id="charts"></div>
        <div class="muted small chart-hint">在曲线上拖动选一段可放大，双击还原；点右侧的弯直接跳过去。</div>
      </div>
      <aside class="cmp-side">
        <div class="card map-card">
          <div class="card-head"><h3>赛道图</h3><span class="muted small" id="map-sub">颜色 = B 在这里丢 / 赚时间</span></div>
          <div class="map-wrap"><canvas id="map"></canvas></div>
          <div class="map-legend small" id="map-legend-full">
            <span>B 赚时间</span><span class="ramp"></span><span>B 丢时间</span>
          </div>
          <div class="map-legend zoom small" id="map-legend-zoom" hidden>
            <span class="lk"><span class="sw" style="background:var(--accent)"></span>A</span>
            <span class="lk"><span class="sw" style="background:var(--accent-2)"></span>B</span>
            <span class="lk"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5"/></svg>刹车点</span>
            <span class="lk"><svg viewBox="0 0 12 12"><path d="M6 1.5 10.5 10H1.5z"/></svg>转向点</span>
            <span class="lk"><svg viewBox="0 0 12 12"><path d="M6 1 11 6 6 11 1 6z"/></svg>弯心</span>
            <span class="lk"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8"/></svg>全油门</span>
          </div>
        </div>
        <div class="card seg-card">
          <div class="card-head">
            <h3>逐弯分析</h3>
            <span class="grow"></span>
            <span class="seg-sort" role="group" aria-label="排序">
              <button class="small-btn on" data-sort="loss">按丢时间</button>
              <button class="small-btn" data-sort="track">按赛道顺序</button>
            </span>
          </div>
          <div class="seg-list" id="seg-list"></div>
          <div class="muted small seg-note">刹车 % 只是踏板踩了多深（Data Out 没有 ABS 状态，实际制动看减速 G）；
            手柄的方向输入可能被游戏做过死区 / 平滑处理，“修方向”次数仅供参考。</div>
        </div>
      </aside>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/vendor/uPlot.iife.min.js"></script>
<script src="/common.js"></script>
<script src="/laps.js"></script>
</body>
</html>
