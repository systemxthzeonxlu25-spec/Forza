[project]
name = "forza-telemetry"
version = "0.1.0"
description = "Forza Motorsport / Forza Horizon Data Out 遥测分析工具（练车、调车用）"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2", "uvicorn[standard]>=0.29", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
