# 调车诊断的全部阈值（forza/tuning.py 读取）。
#
# - 改完保存即可，下次请求诊断时自动重新读取（不用重启服务）。
# - 这个文件缺失、或者某一项删掉了，都会退回 tuning.py 里的内置默认值（DEFAULT_RULES）。
# - 文件写错（TOML 语法错误）时整个文件被忽略、使用内置默认值，诊断结果的 data_quality 里会提示。
# - 这些都是经验规则（启发式），不是游戏官方给的标准。数字是按 Data Out 的“归一化”通道定的：
#   归一化侧偏角 / 滑移率 |x| > 1 表示轮胎已经超过抓地极限；悬挂 0 = 伸到最长，1 = 压到底。
# - 所有判断只用数值大小（绝对值），不依赖正负号——真实游戏的正负号约定没有逐个核实过。

[general]
min_lap_m = 400.0          # 一圈数据短于这么多米：数据不足，不下任何结论
min_duration_s = 20.0      # 一圈数据短于这么多秒：数据不足
min_samples = 200          # 采样点少于这么多：数据不足
min_speed_ms = 8.0         # 车速低于这个（m/s，约 29 km/h）的采样不参与滑移类判断（低速时滑移值很不稳定）
merge_gap_s = 0.10         # 同一个现象中间断开不超过这么久（秒），算同一次
low_sample_hz = 20.0       # 采样率低于这个（Hz）时提示：短事件（触底、抱死）可能漏掉

[balance]
# 转向不足 / 转向过度：比较前轴、后轴的归一化侧偏角（左右两轮取绝对值再平均）
grip_limit = 1.0           # 某一轴 |侧偏角| 超过这个 = 这根轴已经过了抓地极限
axle_diff = 0.30           # 过极限的那根轴还要比另一根轴大这么多，才算“一头先滑”（两头都滑是四轮漂移，不算）
min_duration_s = 0.25      # 连续这么久（秒）才算一次（过滤一闪而过的毛刺）
min_lat_g = 0.30           # 入弯 / 出弯阶段：横向 G 至少这么大才算在转弯（直线上侧偏角没意义）
mid_min_lat_g = 0.50       # 弯中阶段：横向 G 至少这么大（“明显在转弯”）
entry_min_brake = 0.10     # 入弯阶段 = 弯心之前、刹车 ≥ 这个（0~1）且有转向
entry_min_steer = 0.05     # 入弯阶段要求方向盘 |steer| ≥ 这个（0~1，打满 = 1）
exit_min_throttle = 0.50   # 出弯阶段 = 过弯心后、油门 ≥ 这个；弯中阶段要求油门 < 这个、刹车 < entry_min_brake
exit_extend_m = 30.0       # 出弯阶段可以延伸到弯道终点之后这么多米
min_phase_s = 0.30         # 某个弯的某个阶段数据少于这么久（秒）就不评估（样本太少）
alert_total_s = 1.50       # 一圈里同一阶段累计超过这么久（秒）→ 严重
alert_corners = 3          # 或者在这么多个弯都出现 → 严重

[suspension]
bottom_level = 0.98        # 归一化悬挂行程 ≥ 这个 = 压到底（触底）
lift_level = 0.02          # 归一化悬挂行程 ≤ 这个 = 伸到底（车轮可能离地）
min_samples = 3            # 连续这么多个采样点才算一次（60 Hz 下 3 个 = 0.05 s）
group_m = 15.0             # 同一种现象相距不到这么多米的，归成同一个位置
kerb_window_s = 0.10       # 前后这么多秒内该轮压了路肩（rumble = 1）→ 算“压路肩造成”，只提示
alert_events = 3           # 一圈里同一根轴（非路肩）触底的位置达到这么多个 → 严重
lift_warn_s = 0.30         # 非路肩的伸到底累计超过这么久（秒）才算“注意”，否则只提示

[tires]
warm_ref_frac = 0.20       # 用这圈最后 20% 的四轮平均胎温当“热胎参考值”
warm_margin_c = 5.0        # 四轮平均胎温达到“参考值 − 5 °C”之后的数据才用（冷胎 / 第一圈前半段跳过）
min_warm_s = 30.0          # 热胎数据少于这么多秒：数据不足，不判断胎温
lr_diff_c = 6.0            # 同一根轴左右胎温差 ≥ 这个（°C）→ 可能有问题
lr_alert_c = 12.0          # 同轴左右差 ≥ 这个（°C）且不能用赛道方向解释 → 严重
dominant_share = 0.60      # 右弯（或左弯）转角占全圈转角的比例 ≥ 这个，算“这条赛道以右弯（左弯）为主”
axle_excess_c = 4.0        # 两根轴的左右差相差不到这个（°C）且偏热的一侧和赛道方向一致 → 视为赛道方向造成的正常现象
axle_diff_c = 8.0          # 前轴平均 和 后轴平均 差 ≥ 这个（°C）→ 前后负担不平衡
driven_axle_bonus_c = 4.0  # 偏热的是唯一的驱动轴时，上面的阈值再放宽这么多（驱动轴本来就更热）
rising_c_per_min = 3.0     # 热胎段四轮平均胎温还在以 ≥ 这个速度（°C/分钟）上升 → 提示“还没稳定”，置信度降一级
sane_min_c = 40.0          # 热胎平均胎温低于这个 / 高于下一项，提示检查 config 里的胎温单位（tire_temp_unit）
sane_max_c = 150.0

[traction]
# 出弯空转：驱动轮（按 meta.drivetrain：前驱=前轮，后驱=后轮，四驱=四轮）
slip_limit = 1.0           # 驱动轮 |滑移率| 超过这个 = 空转（失去抓地）
min_throttle = 0.50        # 同时油门 ≥ 这个
max_brake = 0.10           # 且刹车 < 这个（排除左脚刹车等情况）
min_duration_s = 0.10      # 连续这么久（秒）才算一次
alert_total_s = 1.0        # 一圈累计超过这么久（秒）→ 严重
alert_events = 3           # 或者出现这么多次 → 严重

[brakes]
slip_limit = 1.0           # 刹车时 |滑移率| 超过这个 = 抱死
min_brake = 0.30           # 刹车 ≥ 这个（0~1）才算在刹车
min_duration_s = 0.10      # 连续这么久（秒）才算一次
alert_total_s = 0.50       # 一圈累计超过这么久（秒）→ 严重
alert_events = 3           # 或者出现这么多次 → 严重

[brake_balance]
# 刹车平衡：只看“直线重刹段”，比较前后轴 |滑移率|（左右两轮取平均）谁先接近极限。不用等抱死就能看出偏前还是偏后
min_brake = 0.50           # 刹车 ≥ 这个（0~1）才算重刹
max_steer = 0.05           # 方向盘 |steer| < 这个才算直线（带着方向刹车时前后轴滑移不只是刹车平衡造成的）
min_speed_kmh = 60.0       # 车速 > 这个（km/h）
kerb_window_s = 0.10       # 前后这么多秒内压了路肩的采样不要
min_zone_s = 0.30          # 一段直线重刹至少持续这么久（秒）才评估
slip_mark = 0.80           # 比较“谁先连续到 0.80”：先到的那根轴先接近极限
peak_pct = 95.0            # 每段的“峰值”取 |滑移率| 的第 95 百分位（不取最大值，免得一个毛刺定结论）
bias_diff = 0.15           # 两轴都没先到 slip_mark 时，峰值差 ≥ 这个才算偏向一边
min_eval_peak = 0.30       # 两轴峰值都 < 这个：刹得不够重，这段不评估
mark_lead_s = 0.05         # 两轴都到了 slip_mark 时，早到 ≥ 这么多秒才算“先到”
min_zones = 2              # 至少这么多段可评估的重刹，才下结论；偏向同一根轴的段也要 ≥ 这么多
dominant_share = 0.50      # 偏向同一根轴的段占可评估段的比例 ≥ 这个才报（个别段偏向只算偶发）

[brake_pressure]
# 刹车压力：直线刹车时“踏板 → 减速度”的关系。踩到某个位置减速度就不再增加 = 压力偏大（后面那截行程没用、更容易抱死）
min_brake = 0.05           # 刹车 ≥ 这个才算在刹车
max_steer = 0.05           # 直线：|方向盘| < 这个
max_throttle = 0.05        # 油门 ≤ 这个
min_speed_kmh = 60.0       # 车速 > 这个（km/h）
kerb_window_s = 0.10       # 压路肩前后这么多秒的采样不要
pedal_bin = 0.10           # 踏板按这个宽度分区间（0.10 = 每 10% 一个区间），每个区间取减速度中位数
min_bin_s = 0.15           # 一个踏板区间至少要有这么多秒的数据才算（踩踏板的过渡瞬间不算）
min_bins = 4               # 一个车速档至少要有这么多个有效区间
min_span = 0.40            # 有效区间覆盖的踏板跨度至少这么大（比如 40%~80%），总是一脚到底就看不出来
sat_frac = 0.95            # 从某个区间起，后面所有区间的减速度都 ≥ 最大值 × 这个 → 这里就“饱和”了
sat_warn_pedal = 0.80      # 饱和点 ≤ 这个踏板位置才报“压力偏大”
min_bins_above = 2         # 饱和点后面至少还有这么多个区间（证明“再踩也不增加”）
full_pedal = 0.80          # 而且最深要踩到 ≥ 这个
speed_band_quantiles = [0.5]   # 车速分档：按这圈刹车时车速的分位数切（[0.5] = 中位数切成低速 / 高速两档）
speed_band_edges_kmh = []      # 想用固定边界就写在这里（例如 [120.0, 200.0]），写了就不用上面的分位数
coast_max_pedal = 0.02     # 滑行段 = 刹车 ≤ 这个且不踩油门：用来拟合风阻 + 发动机制动（减速度 = a + b·车速²），再从刹车减速度里扣掉
min_coast_s = 1.0          # 直线滑行数据少于这么多秒就不扣（会在说明里写明；赛道上直线滑行本来就少，常见是刹车前松油那一下）

[differential]
# 差速器：入弯松刹时的内侧驱动轮（减速锁止）、四驱前后轴滑移（中央差速器）。出弯空转分内侧 / 外侧轮的判断在 [traction] 那项里
min_lat_g = 0.30           # 在转弯：|横向 G| ≥ 这个
lift_max_throttle = 0.15   # 入弯松刹 = 弯心前、油门 ≤ 这个
lift_max_brake = 0.10      #           且刹车 ≤ 这个（还在刹车的归“刹车抱死”管）
slip_limit = 1.0           # 驱动轮 |滑移率| 超过这个 = 被拖滑 / 空转
min_duration_s = 0.10      # 连续这么久（秒）才算一次
alert_corners = 3          # 在这么多个弯出现 → 严重
min_lift_s = 0.50          # 一圈里入弯松刹的数据少于这么多秒就不判断
sa_rise = 0.20             # 出弯两个后轮一起空转时，后轴 |侧偏角| 比空转前高出这么多 → 车尾也在滑（锁止偏高或油门早）
sa_window_s = 0.30         # 比较“空转前”用的时间窗（秒）
awd_ratio = 1.6            # 四驱：给油接近极限时一根轴的平均滑移是另一根的这么多倍 → 中央差速器分配偏向它
awd_min_slip = 0.50        # “接近极限”= 某一轴 |滑移率| ≥ 这个
awd_min_s = 0.30           # 接近极限的数据至少这么多秒才判断

[balance_map]
# 平衡指数 B = 前轴平均 |侧偏角| − 后轴平均 |侧偏角|（> 0 推头，< 0 甩尾），按车速分档 + 弯 × 入弯/弯中/出弯 热力表
speed_band_quantiles = [0.33, 0.67]   # 车速分档：按这圈转弯时车速的分位数切成 3 档（按这台车自己的车速，不写死）
speed_band_edges_kmh = []             # 想用固定边界就写在这里（例如 [100.0, 160.0]），写了就不用上面的分位数
min_band_s = 1.0           # 一个车速档至少要有这么多秒的转弯数据，否则这档显示“样本不足”
tendency_b = 0.15          # |B| ≥ 这个才说“偏推头 / 偏甩尾”，否则算中性
tendency_share = 0.15      # 或者：这一档里 |B| ≥ [balance].axle_diff 的时间占比 ≥ 这个（且是另一方向的 2 倍以上）也算偏推头 / 偏甩尾
                           # （个别弯明显推头会被其他中性的弯“平均掉”，所以除了平均值还看时间占比）
color_full_b = 0.50        # 热力表颜色在 |B| = 这个时最深
top_cells = 3              # 解读句里列出最明显的几格
# 热力表每格的最少数据量沿用 [balance] 的 min_phase_s，不够的格子显示灰色

[body]
# 车身与悬挂（只是量化数据，不出“问题”结论）：行程分位数、悬挂速度直方图、侧倾 / 点头梯度
kerb_window_s = 0.10       # 压路肩前后这么多秒的采样不要
damper_split_mm_s = 25.0   # 悬挂速度低速 / 高速的分界（mm/s），阻尼调校里的“低速 / 高速”大致按这个分
hist_bin_mm_s = 10.0       # 直方图每格宽度（mm/s）
hist_max_mm_s = 200.0      # 直方图范围 ±这么多（超出的算进最边上一格）
max_gap_factor = 3.0       # 两个采样间隔超过典型间隔的这么多倍（丢包）时，那里不算悬挂速度
roll_min_lat_g = 0.50      # 侧倾：稳态弯 = |横向 G| ≥ 这个
steady_max_dg_s = 1.0      #       且横向 G 变化 ≤ 这么多 G/秒（排除入弯、换向的瞬态）
pitch_min_long_g = 0.30    # 点头 / 抬头：直线上 |纵向 G| ≥ 这个
pitch_max_lat_g = 0.20     #       且 |横向 G| ≤ 这个
cruise_max_long_g = 0.10   # 匀速直线（前后行程差的基准）= |纵向 G| ≤ 这个
near_bottom = 0.95         # 行程 p99 ≥ 这个：提示“行程基本用满”
near_top = 0.05            # 行程 p1 ≤ 这个：提示“会伸到最长”
min_samples = 120          # 采样少于这么多不算分位数 / 直方图
min_fit_s = 1.0            # 侧倾 / 点头梯度至少要这么多秒的数据
grade_smooth_m = 10.0      # 参考用的 pitch：路面坡度按这么多米平滑后的高度变化算，再从 pitch 里扣掉

[gearing]
limiter_frac = 0.98        # 转速 ≥ 最高转速（engine_max_rpm）× 这个 = 撞断油
min_duration_s = 1.0       # 在本圈用到的最高挡里撞断油连续这么久（秒）才报
merge_gap_s = 0.25         # 断油器会让转速来回跳，中间断开不超过这么久（秒）算同一次
alert_total_s = 3.0        # 累计超过这么久（秒）→ 严重
min_gear_time_s = 1.0      # 某个挡位累计用了这么久（秒）才算“用到过”（过滤换挡瞬间的跳变）
headroom_frac = 0.85       # 最高挡最高转速还不到最高转速的这个比例 → 提示齿比可能偏长（仅提示）

[confidence]
high_factor = 4.0          # 累计时长 ≥ 最短时长 × 这个，且超出阈值的幅度 ≥ margin → 高
medium_factor = 1.5        # 累计时长 ≥ 最短时长 × 这个，或超出幅度 ≥ margin → 中；否则低
margin = 0.10              # “超出幅度”= (实测 − 阈值) / 阈值

[multi]
# 多圈合并（diagnose_many）
sporadic_frac = 0.5        # 只在少于这个比例的圈里出现 → 视为偶发：严重程度和置信度各降一级
